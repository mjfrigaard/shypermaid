name: Build Installers

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    name: "Build ${{ matrix.platform }}-${{ matrix.arch }}"
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest,   platform: mac,   arch: arm64 }
          - { os: macos-15-intel, platform: mac,   arch: x64 }
          - { os: windows-latest, platform: win,   arch: x64 }
          - { os: ubuntu-latest,  platform: linux, arch: x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      # Copy the package into electron/app/ (gitignored) before every build
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Refresh electron/app
        run: python tools/scaffold_py.py --strategy=bundled --module=shypermaid.app
        shell: bash

      - uses: coatless-actions/shiny-to-electron@v1
        with:
          appdir: electron/app
          app-name: shypermaid
          platform: ${{ matrix.platform }}
          arch: ${{ matrix.arch }}

  release:
    name: "Release"
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
