name: Build Installers

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    name: "Build ${{ matrix.platform }}-${{ matrix.arch }}"
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest,   platform: mac,   arch: arm64 }
          - { os: macos-15-intel, platform: mac,   arch: x64 }
          - { os: windows-latest, platform: win,   arch: x64 }
          - { os: ubuntu-latest,  platform: linux, arch: x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      # Copy the package into electron/app/ (gitignored) before every build
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Refresh electron/app
        run: python tools/scaffold_py.py --strategy=bundled --module=shypermaid.app
        shell: bash

      - uses: coatless-actions/shiny-to-electron@v1
        id: electron
        with:
          appdir: electron/app
          app-name: shypermaid
          platform: ${{ matrix.platform }}
          arch: ${{ matrix.arch }}

      # shinyelectron only targets AppImage on Linux; repackage the same
      # unpacked app as a .deb with the electron-builder it installed
      - name: Build .deb
        if: matrix.platform == 'linux'
        working-directory: ${{ steps.electron.outputs.electron-app-path }}
        run: >
          npx electron-builder --linux deb --x64 --publish never
          --prepackaged dist/linux-unpacked
          -c.linux.maintainer="Martin Frigaard <mjfrigaard@pm.me>"
          -c.deb.artifactName='${name}_${version}_amd64.${ext}'
        shell: bash
      - if: matrix.platform == 'linux'
        uses: actions/upload-artifact@v7
        with:
          name: shypermaid-linux-x64-deb
          path: ${{ steps.electron.outputs.dist-path }}/*.deb
          if-no-files-found: error

  release:
    name: "Release"
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
