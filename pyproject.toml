[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "shymermaid"
version = "0.2.0"
description = "Shiny for Python app-package that renders Mermaid diagrams"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["shiny>=1.2.0"]

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "mypy",
    "ruff",
    "pytest-playwright>=0.10.0",
]
docs = ["great-docs; python_version >= '3.11'"]

[project.scripts]
shymermaid = "shymermaid.app:run_app"

[tool.hatch.build.targets.wheel]
packages = ["src/shymermaid"]

[tool.ruff]
src = ["src"]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src --cov-report=term-missing"
